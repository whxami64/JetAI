[project]
name = "JetAI"
version = "0.1.0"
description = "AI agent for journal entry testing (JET) on GDPdU accounting exports"
readme = "approach.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Cortea" }]
keywords = ["audit", "journal-entry-testing", "gdpdu", "fraud-detection", "agent"]

dependencies = [
    # Tabular data handling for the GDPdU ledger exports
    "pandas>=2.2",
    "numpy>=1.26",
    # Source document readers
    "openpyxl>=3.1",       # .xlsx workbooks
    "python-docx>=1.1",    # .docx working papers
    "pypdf>=4.2",          # .pdf statements
    # Agent / LLM
    "anthropic>=0.40",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    # CLI + reporting
    "typer>=0.12",
    "rich>=13.7",
    "markitdown[docx,pdf]>=0.1.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs>=2.2",
]

[project.scripts]
jetai = "jetai.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jetai"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "W"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B"]

[tool.ruff.lint.flake8-bugbear]
# typer relies on function-call defaults for Argument/Option metadata.
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.11"
packages = ["jetai"]
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["docx.*", "pypdf.*"]
ignore_missing_imports = true
